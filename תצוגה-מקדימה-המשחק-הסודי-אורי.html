<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המרוץ הסודי של אורי</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:#071b12;color:#fff;overflow:hidden}.game{position:relative;width:100vw;height:100vh;min-height:560px;background:linear-gradient(#8fd5d6 0 45%,#2f7448 45%);isolation:isolate}.game:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 12%,#fff8b9 0 4%,#ffe77d66 5%,transparent 17%),linear-gradient(90deg,#102f1fcc 0 6%,transparent 6% 17%,#17462bcc 17% 23%,transparent 23% 79%,#123b25cc 79% 86%,transparent 86%);opacity:.75;pointer-events:none}.game:after{content:"";position:absolute;left:0;right:0;bottom:0;height:37%;background:linear-gradient(#396a32 0 14%,#80613b 15% 25%,#a77b48 26% 80%,#6f4e2f 81%);clip-path:polygon(0 26%,12% 17%,24% 24%,36% 14%,50% 25%,63% 12%,77% 22%,90% 11%,100% 19%,100% 100%,0 100%);z-index:-1}.top{position:absolute;z-index:12;top:13px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand,.hud,.hint{border:1px solid #fff7bd66;background:#082d1fbd;box-shadow:0 8px 20px #00150b55;backdrop-filter:blur(10px);border-radius:18px;padding:10px 14px}.brand b{display:block;font-size:20px;color:#ffec87}.brand small{color:#eaffdf}.hud{display:flex;gap:14px;font-weight:900}.hud span{white-space:nowrap}.stage{position:absolute;inset:0;overflow:hidden}.tree{position:absolute;bottom:22%;font-size:110px;filter:drop-shadow(0 10px 10px #06221488);opacity:.95}.t1{left:3%}.t2{left:27%;font-size:82px;opacity:.8}.t3{right:3%}.t4{right:31%;font-size:75px;opacity:.72}.desert-layer{display:none}.uri{position:absolute;z-index:7;left:18%;bottom:12%;width:min(190px,23vw);height:min(270px,38vh);object-fit:contain;filter:drop-shadow(0 13px 11px #061d12aa);transition:bottom .12s}.uri.jump{bottom:38%}.obstacle,.coin{position:absolute;z-index:6;right:-120px;object-fit:contain}.obstacle{bottom:13%;width:88px;height:92px;filter:drop-shadow(0 8px 7px #28180b88)}.coin{bottom:20%;width:55px;height:55px;filter:drop-shadow(0 0 12px #fff59b);animation:spin .8s linear infinite}.start{position:absolute;z-index:15;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#06251799,#051b13cc)}.panel{width:min(590px,94%);padding:28px;text-align:center;border-radius:30px;background:linear-gradient(145deg,#174e33ed,#082d20f2);border:2px solid #f7e294aa;box-shadow:0 25px 70px #00150ccc}.panel h1{margin:7px 0;font-size:clamp(31px,6vw,48px);text-shadow:0 4px 13px #00180c}.panel p{line-height:1.65;color:#edffe5}.cta{border:0;border-radius:999px;padding:14px 28px;font-size:18px;font-weight:900;color:#274421;background:linear-gradient(135deg,#fff08d,#e9b944);box-shadow:0 9px 22px #00170c66;cursor:pointer}.controls{position:absolute;z-index:13;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.jumpBtn,.pauseBtn{border:2px solid #fff8c7aa;background:#0b3a28d9;color:#fff;border-radius:50%;width:76px;height:76px;font-size:28px;font-weight:900;box-shadow:0 9px 22px #00190d88;backdrop-filter:blur(8px)}.pauseBtn{width:52px;height:52px;font-size:20px}.hint{font-size:12px;color:#eaffdf}.hidden{display:none!important}.flash{animation:flash .35s}.night{filter:hue-rotate(17deg) brightness(.67)}
.game.desert{background:#88cfea}.game.desert:before,.game.desert:after{display:none}.game.desert .tree{display:none}.game.desert .desert-layer{display:block;position:absolute;pointer-events:none}.desert-sky{z-index:0;inset:0;background:url('assets/v81/runner-sky.webp') center/cover no-repeat}.desert-dunes{z-index:1;left:-2%;right:-2%;bottom:25%;height:47%;background:url('assets/v81/runner-dunes.webp') center bottom/cover repeat-x;opacity:.9}.desert-ground{z-index:4;left:-3%;right:-3%;bottom:-2%;height:35%;background:url('assets/v81/runner-ground.webp') center bottom/cover repeat-x;filter:drop-shadow(0 -6px 9px rgba(97,52,16,.18))}.game.desert .uri{bottom:16%;height:min(235px,34vh)}.game.desert .uri.jump{bottom:42%}.game.desert .obstacle{bottom:16%;width:82px;height:100px}.game.desert .brand,.game.desert .hud,.game.desert .hint{background:#67380ec9;border-color:#ffe09a99}.game.desert .panel{background:linear-gradient(145deg,#a65f20ed,#60320df2)}.game.desert .jumpBtn,.game.desert .pauseBtn{background:#70400fd9}.game.desert .start{background:linear-gradient(#6f3d1299,#3b200ccc)}
@keyframes spin{to{transform:rotateY(360deg)}}@keyframes flash{50%{filter:brightness(1.7)}}@media(max-width:650px){.game{min-height:500px}.brand small,.hint{display:none}.hud{gap:7px;font-size:12px;padding:9px}.tree{font-size:75px}.uri{left:10%;width:30vw}.obstacle{width:62px;height:72px}.coin{width:42px;height:42px}.panel{padding:22px}.jumpBtn{width:68px;height:68px}.game.desert .desert-ground{height:31%}.game.desert .desert-dunes{bottom:23%;height:44%}}
span.obstacle{font-size:70px}span.coin{font-size:45px}@media(max-width:650px){span.obstacle{font-size:54px}span.coin{font-size:37px}}
.game.desert{background:#65bcec}.game.desert .desert-sky{background-image:url('assets/v84/desert-runner-background.webp');background-position:center;background-size:cover}.game.desert .desert-dunes{display:none!important}.game.desert .desert-ground{height:31%;opacity:.96}.game.desert .panel{background:linear-gradient(145deg,rgba(151,86,25,.94),rgba(89,45,10,.96));border-color:#ffe09a}.game.desert .start{background:linear-gradient(rgba(75,43,15,.35),rgba(49,26,7,.72))}
.game.desert .desert-sky{background-image:url('assets/v87/runner-wide.png')}.game.desert .desert-ground{display:none!important}.game.desert .uri{mix-blend-mode:multiply;border-radius:24px;bottom:7%;height:min(300px,43vh)}.game.desert .uri.jump{bottom:34%}.game.desert .obstacle{bottom:8%}.game.desert .coin{bottom:22%}.new-assets-v87{width:min(360px,78%);max-height:120px;object-fit:contain;margin:8px auto 14px;display:block}
@media(max-width:650px){.game.desert .desert-sky{background-image:url('assets/v87/runner-mobile.png')}.game.desert .uri{left:6%;width:38vw;height:min(250px,38vh);bottom:8%}}
</style></head>
<body><main id="game" class="game"><div class="top"><div class="brand"><b id="gameTitle">🌲 המרוץ הסודי של אורי</b><small id="gameSubtitle">אוספים אור ומתגברים על מכשולי היער</small></div><div class="hud"><span>⭐ <b id="score">0</b></span><span>💎 <b id="gems">0</b></span><span>❤️ <b id="lives">3</b></span><span>🏆 <b id="best">0</b></span></div></div><div id="stage" class="stage"><div class="desert-layer desert-sky"></div><div class="desert-layer desert-dunes"></div><div class="desert-layer desert-ground"></div><span class="tree t1">🌲</span><span class="tree t2">🌳</span><span class="tree t3">🌲</span><span class="tree t4">🌳</span><img id="uri" class="uri" src="assets/v73/ori-walking.webp" alt="אורי רץ ביער"></div><div class="controls"><button id="jump" class="jumpBtn" aria-label="קפיצה">⬆️</button><div class="hint">מקש רווח או הכפתור לקפיצה</div><button id="pause" class="pauseBtn" aria-label="השהיה">⏸</button></div><section id="overlay" class="start"><div class="panel"><div id="introEmoji" style="font-size:65px">🌲✨🏃</div><small>משחק סודי חדש</small><h1>המרוץ הקסום של אורי</h1><img id="newAssetsV87" class="new-assets-v87 hidden" src="assets/v87/game-objects.png" alt="המכשולים והפרסים במשחק"><p>קופצים מעל סלעים וגזעי עץ, אוספים כוכבים ויהלומים, והמהירות עולה ככל שמתקדמים.</p><button id="start" class="cta">מתחילים לרוץ ←</button></div></section></main>
<script>
const game=document.getElementById('game'),stage=document.getElementById('stage'),uri=document.getElementById('uri'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),gemsEl=document.getElementById('gems'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),desert=new URLSearchParams(location.search).get('world')==='2';let running=false,paused=false,jumping=false,score=0,gems=0,lives=3,speed=5,last=0,nextSpawn=0,objects=[];let best=Number(localStorage.getItem('mitkadmimSecretBest'+(desert?'Desert':'Forest')))||0;bestEl.textContent=best;
const sounds={jump:'assets/v82/jump.mp3',collect:'assets/v82/collect.mp3',hit:'assets/v82/hit.mp3'};function sound(kind,volume=.25){try{const a=new Audio(sounds[kind]);a.volume=volume;a.play().catch(()=>{})}catch(e){}}
if(desert){game.classList.add('desert');uri.src='assets/v87/ori-walking.jpg';uri.alt='אורי במשחק הסודי';document.getElementById('gameTitle').textContent='🏜️ המרוץ הסודי במדבר';document.getElementById('gameSubtitle').textContent='אוספים כוכבים ויהלומים לאורך הדרך';document.getElementById('introEmoji').textContent='🏜️✨🏃';document.getElementById('newAssetsV87').classList.remove('hidden');overlay.querySelector('h1').textContent='המרוץ במדבר הקסום';overlay.querySelector('p').textContent='קופצים מעל סלעים, גזעים ובורות, אוספים כוכבים ויהלומים ושומרים על שלושה לבבות לאורך המסלול.'}
function jump(){if(!running||paused||jumping)return;jumping=true;sound('jump',.2);uri.classList.add('jump');setTimeout(()=>{uri.classList.remove('jump');setTimeout(()=>jumping=false,120)},520)}
function spawn(){const collectible=Math.random()>.53,el=document.createElement(desert?'img':'span');el.className=collectible?'coin':'obstacle';if(desert){if(collectible){const gem=Math.random()>.76;el.src=gem?'assets/v81/diamond.webp':'assets/v87/star.png';el.dataset.gem=gem?'1':'0';el.alt=gem?'יהלום':'כוכב';el.style.bottom=(Math.random()>.52?34:19)+'%'}else{const choices=['rock','dry-log','tumbleweed'],pick=choices[Math.floor(Math.random()*choices.length)];el.src=`assets/v81/${pick}.webp`;el.alt='מכשול בדרך'}}else{el.textContent=collectible?(Math.random()>.78?'💎':'⭐'):(Math.random()>.5?'🪵':'🪨');el.dataset.gem=el.textContent==='💎'?'1':'0';if(collectible)el.style.bottom=(Math.random()>.52?43:18)+'%'}el.dataset.kind=collectible?'coin':'obstacle';stage.appendChild(el);objects.push({el,x:innerWidth+80,hit:false});nextSpawn=performance.now()+Math.max(720,1580-speed*68)+Math.random()*700}
function collide(o){const a=uri.getBoundingClientRect(),b=o.el.getBoundingClientRect();return a.left<b.right-10&&a.right>b.left+10&&a.top<b.bottom-8&&a.bottom>b.top+8}
function end(){running=false;objects.forEach(o=>o.el.remove());objects=[];best=Math.max(best,Math.floor(score));localStorage.setItem('mitkadmimSecretBest'+(desert?'Desert':'Forest'),best);bestEl.textContent=best;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent=lives>0?'המרוץ נעצר':'המסע הסתיים';overlay.querySelector('p').textContent=`אספת ${Math.floor(score)} נקודות ו־${gems} יהלומים. השיא שלך הוא ${best}.`;document.getElementById('start').textContent='רצים שוב ←'}
function frame(t){if(!running)return;if(paused){requestAnimationFrame(frame);return}const dt=Math.min(32,t-last||16);last=t;score+=dt*.01;speed=Math.min(12,5+score/100);scoreEl.textContent=Math.floor(score);if(score>250)game.classList.add('night');if(t>nextSpawn)spawn();for(const o of [...objects]){o.x-=speed*dt*.095;o.el.style.right=(innerWidth-o.x)+'px';if(!o.hit&&collide(o)){o.hit=true;if(o.el.dataset.kind==='coin'){sound('collect',.25);score+=o.el.dataset.gem==='1'?45:20;if(o.el.dataset.gem==='1')gems++;gemsEl.textContent=gems;game.classList.add('flash');setTimeout(()=>game.classList.remove('flash'),300);o.x=-200}else if(!jumping){sound('hit',.18);lives--;livesEl.textContent=lives;uri.style.filter='drop-shadow(0 0 18px #ff6d5f)';setTimeout(()=>uri.style.filter='',350);o.x=-200;if(lives<=0)return end()}}if(o.x<-150){o.el.remove();objects.splice(objects.indexOf(o),1)}}requestAnimationFrame(frame)}
function start(){score=0;gems=0;lives=3;speed=5;scoreEl.textContent=0;gemsEl.textContent=0;livesEl.textContent=3;game.classList.remove('night');overlay.classList.add('hidden');running=true;paused=false;last=performance.now();nextSpawn=last+900;requestAnimationFrame(frame)}
document.getElementById('start').onclick=start;document.getElementById('jump').onclick=jump;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶':'⏸'};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='Escape')document.getElementById('pause').click()});stage.addEventListener('pointerdown',jump);
</script></body></html>
